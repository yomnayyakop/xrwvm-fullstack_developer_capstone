name: Lint Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run Python linting
        working-directory: server
        run: |
          find . -name "*.py" -print0 | xargs -0 flake8

  lint_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JSHint
        run: npm install jshint

      - name: Run JavaScript linting
        run: |
          find server/database -name "*.js" -print0 | xargs -0 ./node_modules/.bin/jshint

      - name: Linting completed
        run: echo "JavaScript linting completed successfully"
